[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CerealNotFound/aulora"
authors = ["Adarsh Pandey"]
rust-version = "1.95"

[workspace.dependencies]
aulora-core = { path = "crates/aulora-core" }
aulora-daemon = { path = "crates/aulora-daemon" }
aulora-tui = { path = "crates/aulora-tui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ratatui = "0.30"
clap = { version = "4", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
libc = "0.2"
unicode-width = "0.2"
dirs = "6"
portable-pty = "0.9"
vt100 = "0.18"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
similar = "3.2"
ignore = "0.4"
nucleo-matcher = "0.3"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
